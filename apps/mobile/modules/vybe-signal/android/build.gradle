plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'app.vybe'
version = '0.1.0'

expoModule {
  v2 true
}

android {
  namespace "expo.modules.vybesignal"
  defaultConfig {
    versionCode 1
    versionName "0.1.0"
  }
}

dependencies {
  // Signal's official protocol library (AGPL-3.0). Repository is added app-wide via expo-build-properties.
  implementation "org.signal:libsignal-android:0.105.1"
}
