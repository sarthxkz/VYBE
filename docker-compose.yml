# Dev/test only. Ports bound to localhost.
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: vybe
      POSTGRES_PASSWORD: vybe_dev_password
      POSTGRES_DB: vybe
    ports: ["127.0.0.1:5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "vybe"]
      interval: 2s
      retries: 20
  mailpit:
    image: axllent/mailpit:v1.27
    ports: ["127.0.0.1:1025:1025", "127.0.0.1:8025:8025"]
volumes:
  pgdata:
