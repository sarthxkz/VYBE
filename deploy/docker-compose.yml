# Vybe on the Oracle VM. Caddy owns ports 80/443 and terminates TLS; nothing else publishes a port.
# Run from this folder: docker compose up -d --build   (setup.sh writes .env first)
name: vybe
x-logging: &logging
  driver: json-file
  options: { max-size: 10m, max-file: '3' }

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: vybe
      POSTGRES_DB: vybe
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?run setup.sh first}
    volumes:
      - db-data:/var/lib/postgresql/data
    networks: [internal]
    healthcheck:
      test: ['CMD', 'pg_isready', '-U', 'vybe', '-d', 'vybe']
      interval: 5s
      retries: 20
    restart: unless-stopped
    logging: *logging

  migrate:
    build: { context: .., dockerfile: apps/server/Dockerfile, target: build }
    env_file: .env
    working_dir: /app/apps/server
    command: ['npx', 'prisma', 'migrate', 'deploy']
    depends_on: { db: { condition: service_healthy } }
    networks: [internal]
    restart: 'no'

  vybe-api:
    build: { context: .., dockerfile: apps/server/Dockerfile }
    env_file: .env
    volumes:
      - media:/data/media
    depends_on: { migrate: { condition: service_completed_successfully } }
    networks: [internal, edge]
    restart: unless-stopped
    logging: *logging

  caddy:
    image: caddy:2.8.4-alpine
    depends_on: [vybe-api]
    environment:
      PUBLIC_HOST: ${PUBLIC_HOST:-api.161-153-37-106.sslip.io}
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./public:/srv/public:ro # app updates (OTA bundles, APKs)
      - caddy-data:/data
      - caddy-config:/config
    networks: [edge]
    restart: unless-stopped
    logging: *logging

volumes:
  db-data:
  media:
  caddy-data: # TLS certificates and ACME account
  caddy-config:

networks:
  internal:
    internal: true # no route out: the database never talks to the internet
  edge: {} # Caddy <-> API, and the API's route out (SMTP, FCM, Google)
