# /etc/nginx/sites-available/vybe  (setup-vm.sh renders __HOST__)
# TLS certificates are added by certbot --nginx. Only 80/443 are public; the API listens on 127.0.0.1:3000.

limit_req_zone $binary_remote_addr zone=vybe_api:10m rate=20r/s;
# Never log query strings (they may contain search terms).
log_format vybe '$remote_addr [$time_local] "$request_method $uri" $status $body_bytes_sent $request_time';

map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}

server {
  listen 80;
  listen [::]:80;
  server_name __HOST__;
  # certbot adds the HTTP->HTTPS redirect and the 443 server block below.

  server_tokens off;
  client_max_body_size 17m;          # media upload limit (16 MiB) + multipart overhead
  client_body_timeout 30s;

  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy no-referrer always;

  access_log /var/log/nginx/vybe.access.log vybe;

  location /ws {
    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s;          # server pings every 30s
  }

  location / {
    limit_req zone=vybe_api burst=40 nodelay;
    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_request_buffering off;
  }
}
